<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Для Вики ❤️</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}
body{overflow:hidden;background:#120812}
canvas{position:fixed;inset:0;z-index:-2}
.bg{position:fixed;inset:0;z-index:-3;background:radial-gradient(circle at 50% 45%,#ff4f9130,transparent 28%),linear-gradient(135deg,#0d0710,#250d1d 55%,#09060d)}
main{min-height:100vh;display:grid;place-items:center;padding:25px}
.scene{text-align:center;width:min(850px,100%)}
.intro{transition:opacity .5s,transform .5s}
.intro.hide{opacity:0;transform:translateY(-20px);pointer-events:none}
h1{font-size:clamp(38px,8vw,76px);margin:0 0 12px;background:linear-gradient(90deg,#fff,#ff9fc4,#fff);-webkit-background-clip:text;color:transparent}
.subtitle{font-size:18px;color:#ddcbd8;margin:0 0 38px}
.envelope-wrap{position:relative;width:min(360px,82vw);height:260px;margin:auto;cursor:pointer;filter:drop-shadow(0 25px 35px #0008)}
.envelope{position:absolute;inset:25px 0 0;background:#d94278;border-radius:8px;box-shadow:0 18px 45px #0006;transition:transform .6s}
.front{position:absolute;inset:0;overflow:hidden;border-radius:8px;background:linear-gradient(145deg,#f35d91,#a92c69)}
.front:before,.front:after{content:"";position:absolute;bottom:0;width:72%;height:75%;background:#c63c75}
.front:before{left:-23%;transform:skewX(38deg)}
.front:after{right:-23%;transform:skewX(-38deg)}
.flap{position:absolute;z-index:5;left:0;top:0;width:100%;height:58%;background:linear-gradient(145deg,#ff83aa,#c53b73);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .85s cubic-bezier(.2,.8,.2,1);border-radius:8px 8px 0 0}
.seal{position:absolute;z-index:7;left:50%;top:43%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#fff0f5;color:#d62f6e;font-size:27px;box-shadow:0 5px 18px #7e194855;transition:.4s}
.letter{position:absolute;z-index:3;left:8%;width:84%;height:76%;bottom:7%;border-radius:8px;background:#fff7fb;color:#5c3148;padding:25px 20px;box-shadow:0 10px 25px #0003;transform:translateY(20%);transition:transform .9s cubic-bezier(.2,.8,.2,1);opacity:0}
.letter h2{margin:0 0 8px;font-size:25px}.letter p{margin:5px 0;font-size:14px;line-height:1.5}
.open .flap{transform:rotateX(180deg)}
.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.5)}
.open .letter{transform:translateY(-62%);opacity:1}
.open .envelope{transform:translateY(75px)}
.hint{margin-top:24px;color:#cdb7c8;font-size:14px;transition:.4s}
.reveal{display:none;opacity:0}
.reveal.show{display:block;animation:appear 1s .3s forwards}
.card{padding:35px 25px;border:1px solid #ffffff18;background:#ffffff0a;backdrop-filter:blur(18px);border-radius:30px;box-shadow:0 25px 90px #0008}
.card h2{font-size:clamp(30px,6vw,55px);margin:0 0 8px}
.card p{color:#eadbe5;font-size:18px;line-height:1.6;max-width:620px;margin:10px auto}
.heart{font-size:120px;line-height:1;margin:22px 0;cursor:pointer;display:inline-block;filter:drop-shadow(0 0 22px #ff3f7f);user-select:none}
.heart.pulse{animation:beat .8s}
.small{font-size:13px!important;color:#bfaabc!important}
.confetti{position:fixed;width:8px;height:13px;z-index:20;pointer-events:none}
@keyframes beat{0%{transform:scale(1)}25%{transform:scale(1.35)}50%{transform:scale(.9)}75%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes appear{from{opacity:0;transform:scale(.94) translateY(20px)}to{opacity:1;transform:none}}
@media(max-width:500px){.envelope-wrap{height:220px}.letter{padding:16px}.letter h2{font-size:20px}.letter p{font-size:12px}}
</style>
</head>
<body>
<div class="bg"></div><canvas id="stars"></canvas>

<main>
<div class="scene">
<div class="intro" id="intro">
<h1>Для Вики ❤️</h1>
<p class="subtitle">Здесь спрятано кое-что особенное.<br>Открой конверт.</p>

<div class="envelope-wrap" id="envelope" aria-label="Открыть конверт">
  <div class="envelope">
    <div class="letter">
      <h2>Вика ✨</h2>
      <p>Я оставил для тебя маленькое послание.</p>
      <p>Но это ещё не всё…</p>
    </div>
    <div class="front"></div>
    <div class="flap"></div>
    <div class="seal">♥</div>
  </div>
</div>
<div class="hint">нажми на конверт</div>
</div>

<div class="reveal" id="reveal">
<div class="card">
<h2>Ты нашла подарок 💌</h2>
<p>А теперь самое главное.</p>
<div class="heart" id="heart">❤️</div>
<p id="message">Нажми на сердце</p>
<p class="small">Каждое нажатие заставляет его биться сильнее.</p>
</div>
</div>
</div>
</main>

<script>
const canvas=document.getElementById('stars'),ctx=canvas.getContext('2d');
let stars=[];
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;stars=Array.from({length:100},()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*2+.3,a:Math.random()*7}))}
resize();addEventListener('resize',resize);
function starsDraw(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const s of stars){s.a+=.018;ctx.globalAlpha=.12+(Math.sin(s.a)+1)*.12;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}requestAnimationFrame(starsDraw)}starsDraw();

const envelope=document.getElementById('envelope');
let opened=false;
envelope.onclick=()=>{
 if(opened)return; opened=true;
 envelope.classList.add('open');
 setTimeout(()=>{
   document.getElementById('intro').classList.add('hide');
   setTimeout(()=>{
     document.getElementById('intro').style.display='none';
     document.getElementById('reveal').classList.add('show');
     confetti();
   },550);
 },1250);
};

const heart=document.getElementById('heart'),message=document.getElementById('message');
let n=0;
heart.onclick=()=>{
 n++;heart.classList.remove('pulse');void heart.offsetWidth;heart.classList.add('pulse');
 const texts=[
  'Вот оно — маленькое сердце специально для тебя. ❤️',
  'Оно снова забилось сильнее. 💓',
  'Кажется, ему очень нравится, когда ты на него нажимаешь. 💗',
  'Теперь оно точно знает, для кого биться. 💖'
 ];
 message.textContent=texts[Math.min(n-1,texts.length-1)];
 confetti();
};
function confetti(){
 for(let i=0;i<55;i++){
  const c=document.createElement('i');c.className='confetti';
  c.style.left='50%';c.style.top='45%';
  c.style.background=`hsl(${Math.random()*360},90%,72%)`;
  document.body.appendChild(c);
  const x=(Math.random()-.5)*innerWidth*1.1,y=(Math.random()-.5)*innerHeight;
  c.animate([{transform:'translate(-50%,-50%) rotate(0)',opacity:1},{transform:`translate(${x}px,${y+innerHeight*.55}px) rotate(${Math.random()*900-450}deg)`,opacity:0}],{duration:1200+Math.random()*900,easing:'cubic-bezier(.1,.7,.2,1)'}).onfinish=()=>c.remove();
 }
}
</script>
</body>
</html>
